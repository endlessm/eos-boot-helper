# In the initramfs, systemd-repart operates on /sysroot, which only contains
# /usr once the OSTree deployment has been set up by ostree-prepare-root.
# Without this ordering repart runs before /sysroot is mounted, fails with
# ENOENT on /sysroot/usr and is then run again after switching root.
[Unit]
After=sysroot.mount ostree-prepare-root.service
